help.title=IASI Setup Dev {0}
help.description=Herramienta para implementar el sistema de desarrollo del ecosistema IASI.
help.general=USO\n  iasi-setup-dev [flags...] [parámetros...] [targets...]
help.flags=FLAGS\n  -h                          Mostrar esta ayuda\n  -f                          Recrear las máquinas virtuales existentes\n  -a                          Arrancar las máquinas después de crearlas\n  -v                          Mostrar mensajes de progreso\n  -V                          Mostrar mensajes de progreso detallados\n  -s                          No generar mensajes por consola
help.parameters=PARÁMETROS\n  --config <fichero>          Fichero TOML de configuración\n  --env <prefijo>             Prefijo de las variables de entorno\n  --definitions <directorio>  Directorio de definiciones de máquinas\n  --machines <directorio>     Directorio de máquinas virtuales\n  --logs <directorio>         Directorio de ficheros de log
help.targets=TARGETS\n  Máquinas virtuales que se van a procesar.
help.defaults=VALORES POR DEFECTO\n  Directorios: directorio actual.\n  Máquinas existentes: se conservan.\n  Máquinas creadas: no se arrancan.
help.configuration=CONFIGURACIÓN\n  Precedencia (de menor a mayor prioridad):\n  Hardcoded < recursos internos < TOML externo < entorno < CLI
