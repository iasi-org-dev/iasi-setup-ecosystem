help.general=USO\n  iasi-setup-dev <acción> [flags] [parámetros]\n  iasi-setup-dev workflow <acción> [flags] [parámetros]
help.platform=USO\n  iasi-setup-dev platform [flags] [parámetros]\nInforma del SO y runtime del host. No comprueba hipervisores.
help.create=USO\n  iasi-setup-dev create -h\nEjemplo de sintaxis reservado. Crear máquinas no está disponible.
help.workflow=USO\n  iasi-setup-dev workflow help\n  iasi-setup-dev workflow release -h\nNo hay ejecución de workflows implementada.
help.workflowRelease=USO\n  iasi-setup-dev workflow release -h\nEjemplo de sintaxis reservado. No realiza promoción ni ejecuta workflows.
help.flags=FLAGS\n  -h ayuda contextual; -v DEBUG; -V TRACE; -s solo errores; -f force\n  La última verbosidad indicada gana, también dentro de grupos.\n  force está hardcoded a false; solo -f lo activa para esta instancia.
help.parameters=PARÁMETROS\n  --config <archivo>  Valores TOML externos para esta instancia\n  --definitions <directorio>  Definiciones de máquinas\n  --machines <directorio>  Almacenamiento de máquinas (no se escribe en esta tarea)\n  --logs <directorio>  Registros de ejecución\n  Precedencia: hardcoded < recurso opcional del JAR < archivo --config < CLI explícita.\n  Directorios por defecto: CWD original. No busca configuración automáticamente.
help.targets=TARGETS\n  TASK-0001 no admite targets posicionales.
