help.general=USAGE\n  iasi-setup-dev [flags] [parameters] [targets...]
help.platform=USAGE\n  iasi-setup-dev platform [flags] [parameters]\nReport host OS and runtime. No hypervisor probing.
help.create=USAGE\n  iasi-setup-dev create -h\nReserved syntax example. Machine creation is unavailable.
help.workflow=USAGE\n  iasi-setup-dev workflow help\n  iasi-setup-dev workflow release -h\nNo workflow execution implemented.
help.workflowRelease=USAGE\n  iasi-setup-dev workflow release -h\nReserved syntax example. No promotion or workflow execution.
help.flags=FLAGS\n  -h  Show help\n  -f  Force (default false)\n  -a  Start a machine after creating it (default false)\n  -s  Verbosity 0; -v 2; -V 3; default 1\n  Flags may be grouped; the last verbosity selection wins.
help.parameters=PARAMETERS\n  --config <file>          External TOML configuration\n  --env <prefix>           Uppercase PREFIX_NAME environment variables\n  --definitions <directory> Machine definitions\n  --machines <directory>   Machine directory\n  --logs <directory>       Log directory\n  Default directories: current working directory.\n  Precedence: hardcoded < internal resource < external TOML < environment < CLI.
help.targets=TARGETS\n  Multiple names or regular expressions are accepted.\n  Example: iasi-setup-dev --definitions ./defs "iasi-dev-.*"\n  Without targets, select all available targets in definitions.
