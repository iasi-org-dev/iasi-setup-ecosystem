help.general=USO\n  iasi-setup-dev [flags] [parametros] [targets...]
help.platform=USO\n  iasi-setup-dev platform [flags] [parámetros]\nInforma del SO y runtime del host. No comprueba hipervisores.
help.create=USO\n  iasi-setup-dev create -h\nEjemplo de sintaxis reservado. Crear máquinas no está disponible.
help.workflow=USO\n  iasi-setup-dev workflow help\n  iasi-setup-dev workflow release -h\nNo hay ejecución de workflows implementada.
help.workflowRelease=USO\n  iasi-setup-dev workflow release -h\nEjemplo de sintaxis reservado. No realiza promoción ni ejecuta workflows.
help.flags=FLAGS\n  -h  Mostrar ayuda\n  -f  Forzar (por defecto false)\n  -a  Arrancar la maquina despues de crearla (por defecto false)\n  -s  Verbosidad 0; -v 2; -V 3; por defecto 1\n  Se admiten grupos de flags y gana la ultima seleccion de verbosidad.
help.parameters=PARAMETROS\n  --config <fichero>        Configuracion TOML externa\n  --env <prefijo>           Variables PREFIJO_NOMBRE en mayusculas\n  --definitions <directorio> Definiciones de maquinas\n  --machines <directorio>   Directorio de maquinas\n  --logs <directorio>       Directorio de logs\n  Directorios por defecto: directorio actual.\n  Precedencia: hardcoded < recurso interno < TOML externo < entorno < CLI.
help.targets=TARGETS\n  Se admiten varios nombres o expresiones regulares.\n  Ejemplo: iasi-setup-dev --definitions ./defs "iasi-dev-.*"\n  Sin targets se seleccionan todos los disponibles en definitions.
