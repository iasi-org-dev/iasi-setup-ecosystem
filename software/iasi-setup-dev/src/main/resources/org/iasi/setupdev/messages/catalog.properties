help.title=IASI Setup Dev {0}
help.description=Tool for implementing the development system of the IASI ecosystem.
help.general=USAGE\n  iasi-setup-dev [flags...] [parameters...] [targets...]
help.flags=FLAGS\n  -h                          Show this help\n  -f                          Recreate existing virtual machines\n  -a                          Start machines after creating them\n  -v                          Show progress messages\n  -V                          Show detailed progress messages\n  -s                          Do not produce console messages
help.parameters=PARAMETERS\n  --config <file>             TOML configuration file\n  --env <prefix>              Environment variable prefix\n  --definitions <directory>   Machine definitions directory\n  --machines <directory>      Virtual machines directory\n  --logs <directory>          Log files directory
help.targets=TARGETS\n  Virtual machines to process.
help.defaults=DEFAULT VALUES\n  Directories: current working directory.\n  Existing machines: preserved.\n  Created machines: not started.
help.configuration=CONFIGURATION\n  Precedence (lowest to highest priority):\n  Hardcoded < internal resources < external TOML < environment < CLI
