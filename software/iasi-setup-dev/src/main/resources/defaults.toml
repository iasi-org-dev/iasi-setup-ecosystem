# Default CLI parameter values for iasi-setup-dev.
# CLI arguments take precedence over these values.

# Directory containing machine definitions.
definitions = "./definitions"

# Directory where virtual machines are stored.
# Change this default for the target host.
machines = "C:/Machines"

# Directory for execution logs.
logs = "./logs"

# General execution flags.
verbose = 1


# Configurable directory identifiers.
id-host = "iasi-host"
id-machines = "config-data"

# Host recreation authorization.
recreate = true
