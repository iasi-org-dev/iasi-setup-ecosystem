book:
  announcement:
    content: |
      ![](resources/images/ants.png){.iasi-ants-image}
    position: above-navbar
    dismissable: false

  llms-txt: true

  page-footer:
    left: "© 2026 Javier G. Grandez · IASI Rocks 🤘"
    center: '<span id="iasi-publish-date"></span>'
    right:
      - text: "Licencias"
        href: back-matter/903-licenses.qmd

  sidebar:
    collapse-level: 1

  navbar:
    title: "IASI SETUP"
    background: primary
    pinned: true

    # Generated by iasi. Copy and edit as needed.
    left:
      - text: "Organizaciones y roles"
        menu:
          - text: "Introducción"
            href: "docs/10-intro/index.qmd"
    # End generated by iasi.

    right:
      - icon: download
        text: "Guardar ..."
        menu:
          - text: "Guardar ..."
            href: "#iasi-exports"

      - icon: box-arrow-up-right
        href: "#iasi-open-external"
        aria-label: "Abrir en una pestaña nueva"

  search:
    location: navbar
    type: overlay

format:
  html:
    pagetitle: "IASI Ecosystem Installation Guide"
    title-prefix: ""

    include-in-header:
      text: |
        <script>
          (() => {
            const offset =
              document.querySelector('meta[name="quarto:offset"]')?.content || "";

            const script = document.createElement("script");
            script.src = `${offset}resources/js/iasi.js`;
            script.async = false;
            document.head.appendChild(script);
          })();
        </script>

    theme:
      - cosmo
      - resources/css/iasi.scss
      - resources/css/book.scss

    toc: true
