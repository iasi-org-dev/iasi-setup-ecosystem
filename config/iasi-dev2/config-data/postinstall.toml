# IASI DEV2 - Phase 2 declarative catalog.
# Catalog entries are not automatically installed. Enable explicit samples.
[vscode]
extensions = ['golang.go', 'ms-python.python', 'ms-vscode.powershell', 'REditorSupport.r']
enabled = ['ms-vscode.powershell']

[r]
enabled = false
packages = ['languageserver', 'renv', 'rmarkdown']
# Bootstrap only once, then commit renv.lock and switch to restore.
mode = 'bootstrap'
lockfile = 'renv.lock'
repository = 'https://cloud.r-project.org'

# No WSL installation on iasi-dev2.
[github]
organization = 'iasi-org-dev'
target = 'C:\PRJ\iasi-dev'
public_only = true
update = 'ff-only'
