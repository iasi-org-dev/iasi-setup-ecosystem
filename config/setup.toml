# Common VM credentials (lab only). Do not commit production passwords.
[identity]
user = 'iasi'
password = 'iasi'

# The order below is the actual provisioning order.
[[components]]
name = 'hyperv'
type = 'host'
config = 'hyperv.toml'

[[components]]
name = 'wsl'
type = 'wsl'
config = 'wsl.toml'

[[components]]
name = 'iasi-net'
type = 'network'
config = 'iasi-net.toml'

[[components]]
name = 'iasi-dev2'
type = 'hyper-v'
config = 'iasi-dev2'

[[components]]
name = 'iasi-tools'
type = 'hyper-v'
config = 'iasi-tools'

[[components]]
name = 'iasi-models'
type = 'hyper-v'
config = 'iasi-models'
