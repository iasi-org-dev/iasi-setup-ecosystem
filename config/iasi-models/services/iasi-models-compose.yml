name: iasi-models
services:
  ollama:
    image: ollama/ollama:latest
    container_name: iasi-ollama
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all    
    ports:
      - "${IASI_MODELS_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
volumes:
  ollama-data:
    name: iasi-models-ollama-data
