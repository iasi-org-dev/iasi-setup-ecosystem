# IASI-Models: preparación en el sistema de destino durante el despliegue.
[[install]]
action = "run"
command = "mkdir -p /opt/iasi/dxgkrnl"

[[install]]
action = "run"
command = "curl -fL https://content.staralt.dev/dxgkrnl-dkms/main/install.sh -o /opt/iasi/dxgkrnl/install.sh"

[[install]]
action = "run"
command = "chmod +x /opt/iasi/dxgkrnl/install.sh"

[[install]]
action = "copy"
source = "activate-gpu.sh"
target = "/opt/iasi/activate-gpu.sh"

[[install]]
action = "run"
command = "chmod +x /opt/iasi/activate-gpu.sh"

[[install]]
action = "run"
command = "usermod -aG docker iasi"

[[install]]
action = "copy"
source = "iasi-models-compose.yml"
target = "/opt/iasi/iasi-models-compose.yml"

[[install]]
action = "copy"
source = "iasi-services.env"
target = "/opt/iasi/iasi-services.env"

# Stage de GPU: conservar los tres conjuntos completos en el Ubuntu destino.
# setup-gpu.sh NO instala drivers ni crea enlaces simbolicos.
[[install]]
action = "run"
command = "sh /mnt/iasi-seed/services/setup-gpu.sh"
context = "installer"

# NVIDIA Container Toolkit: installed/configured at first boot, after GPU-P.
[[install]]
action = "copy"
source = "setup-nvidia.sh"
target = "/opt/iasi/setup-nvidia.sh"

[[install]]
action = "run"
command = "chmod +x /opt/iasi/setup-nvidia.sh"

# Primer arranque: GPU-P -> verificacion -> NVIDIA Toolkit -> Docker Compose.
# Si falla GPU, el script se detiene sin arrancar los contenedores.
# cloud-init runcmd se ejecuta una vez; se puede repetir manualmente con
#   sudo sh /opt/iasi/iasi-deploy.sh
[[install]]
action = "copy"
source = "iasi-deploy.sh"
target = "/opt/iasi/iasi-deploy.sh"

[[install]]
action = "run"
command = "chmod +x /opt/iasi/iasi-deploy.sh"

[[startup]]
action = "run"
command = "sh /opt/iasi/iasi-deploy.sh"
