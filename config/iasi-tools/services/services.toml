# IASI tools services: ordered operations for installation and first boot.
# Docker and docker-compose-v2 are declared in config-data/packages.toml
# and must be installed by Subiquity before these install operations.

[[install]]
action = "copy"
source = "iasi-tools-compose.yml"
target = "/opt/iasi/iasi-tools-compose.yml"

# Last install step: verify Docker, then grant the iasi user group access.
[[install]]
action = "run"
command = "dpkg-query -W -f='${Status}' docker.io | grep -qx 'install ok installed' && getent group docker >/dev/null && usermod -aG docker iasi"

[[startup]]
action = "run"
command = "systemctl start docker && docker compose -f /opt/iasi/iasi-tools-compose.yml up -d"
